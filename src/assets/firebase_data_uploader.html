<!DOCTYPE html>
<html lang="en" class="bg-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Data Uploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl bg-white p-8 rounded-2xl shadow-lg">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Firebase Data Uploader</h1>
        <p class="text-gray-600 mb-6">
            Upload a JSON array to any public data collection in your Firebase project.
        </p>

        <div class="mb-4">
            <label for="collection-name" class="block text-sm font-medium text-gray-700 mb-1">
                Collection Name
            </label>
            <input type="text" id="collection-name"
                   class="w-full p-3 border border-gray-300 rounded-lg"
                   value="dilemmas"
                   placeholder="e.g., dilemmas, personas">
        </div>

        <div class="mb-4">
            <label for="json-data" class="block text-sm font-medium text-gray-700 mb-1">
                JSON Data
            </label>
            <textarea id="json-data"
                class="w-full h-64 p-4 border border-gray-300 rounded-lg font-mono text-sm"
                placeholder="Paste your JSON array here..."></textarea>
        </div>

        <button id="upload-button"
            class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-lg mt-2
                   hover:bg-blue-700 transition-colors duration-300
                   disabled:bg-gray-400">
            Upload Data to Firebase
        </button>

        <div id="status-message" class="mt-4 text-center"></div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Use environment variables for Firebase config ---
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // --- DOM Elements ---
        const uploadButton = document.getElementById('upload-button');
        const jsonDataEl = document.getElementById('json-data');
        const collectionNameEl = document.getElementById('collection-name');
        const statusMessage = document.getElementById('status-message');

        let db;

        // --- Main Function ---
        async function initializeAndUpload() {
            if (!firebaseConfig.apiKey) {
                statusMessage.innerHTML = `<span class="text-red-600">Firebase config not found. Cannot connect.</span>`;
                return;
            }

            try {
                // Initialize Firebase
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                db = getFirestore(app);

                // Authenticate
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                statusMessage.innerHTML = `<span class="text-green-600">Firebase connected. Ready to upload.</span>`;
                
                uploadButton.disabled = false;
                uploadButton.onclick = handleUpload;

            } catch (err) {
                console.error("Firebase Init Error:", err);
                statusMessage.innerHTML = `<span class="text-red-600">Error connecting to Firebase: ${err.message}</span>`;
            }
        }

        async function handleUpload() {
            const jsonText = jsonDataEl.value;
            const collectionName = collectionNameEl.value.trim();

            if (!collectionName) {
                statusMessage.innerHTML = `<span class="text-red-600">Collection Name cannot be empty.</span>`;
                return;
            }
            if (!jsonText.trim()) {
                statusMessage.innerHTML = `<span class="text-red-600">JSON Data area is empty.</span>`;
                return;
            }

            let dataArray = [];
            try {
                dataArray = JSON.parse(jsonText);
                if (!Array.isArray(dataArray)) throw new Error("Data is not an array.");
            } catch (err) {
                console.error("JSON Parse Error:", err);
                statusMessage.innerHTML = `<span class="text-red-600">Error parsing JSON. Is it a valid array? ${err.message}</span>`;
                return;
            }

            uploadButton.disabled = true;
            statusMessage.innerHTML = `<span class="text-blue-600">Uploading ${dataArray.length} items to '${collectionName}'...</span>`;

            // --- Define the collection path ---
            const collectionPath = `artifacts/${appId}/public/data/${collectionName}`;
            const dataCollection = collection(db, collectionPath);
            
            let successCount = 0;
            let errorCount = 0;

            for (const item of dataArray) {
                try {
                    // addDoc creates a new document with a unique ID
                    await addDoc(dataCollection, item);
                    successCount++;
                } catch (err) {
                    console.error("Firestore Add Error:", err, item);
                    errorCount++;
                }
            }

            statusMessage.innerHTML = `<span class="text-green-600">
                Upload complete! ${successCount} items added to <strong>${collectionName}</strong>. ${errorCount} errors.
                <br>Check your Firebase console at: <br> <strong>${collectionPath}</strong>
            </span>`;
            
            uploadButton.disabled = false;
        }

        // Start the initialization process on page load
        initializeAndUpload();

    </script>
</body>
</html>
